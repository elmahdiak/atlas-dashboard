<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #222634;
      --surface-3: #2c3144;
      --text: #e6e8ee;
      --text-faint: #8a8f9e;
      --line: #2e3346;
      --brass: #e3b24f;
      --teal: #5fc9b8;
      --violet: #9d8ce0;
      --coral: #e2685c;
      --blue: #7fb0e3;
    }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    h2 { margin-top: 0; font-weight: 500; font-size: 1.2rem; }
    button {
      background: var(--brass);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .task-item {
      background: var(--surface-2);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
test
  <div class="grid">
    <div class="card">
      <h2>Mindset & Focus</h2>
      <p id="quoteText">Loading quote...</p>
      <small id="quoteAuthor" style="color:var(--text-faint);"></small>
      <div style="margin-top: 12px;">
        <button onclick="pickRandomQuote()">New Quote</button>
      </div>
    </div>

    <div class="card">
      <h2>Active Tasks</h2>
      <div id="taskList"></div>
    </div>
  </div>

<script>
/* ================= STATE & PERSISTENCE ================= */
let tasks = [
  { id: 1, text: 'Finalize Q3 Marketing Strategy', status: 'todo' },
  { id: 2, text: 'Review Landing Page Wireframes', status: 'doing' }
];

let quotes = [
  { text: "Discipline is choosing between what you want now and what you want most.", author: "Unknown" },
  { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Will Durant" }
];

async function atlasGetState() { 
  try { 
    const res = await fetch('/api/store'); 
    if (!res.ok) throw new Error('Fetch failed'); 
    return await res.json(); 
  } catch (err) { 
    return null; 
  } 
} 

async function atlasPutState(snapshot) { 
  try { 
    await fetch('/api/store', { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify(snapshot) 
    }); 
  } catch (err) { 
    console.error('Save failed:', err); 
  } 
}

async function persistState() {
  await atlasPutState({ tasks, quotes });
}

async function restoreAtlasState() {
  const data = await atlasGetState();
  if (data) {
    if (data.tasks) tasks = data.tasks;
    if (data.quotes) quotes = data.quotes;
  }
  renderTasks();
  pickRandomQuote();
}

/* ================= COMPONENT RENDERING ================= */
function renderTasks() {
  const container = document.getElementById('taskList');
  if (!container) return;
  container.innerHTML = tasks.map(t => `
    <div class="task-item">
      <span>${t.text}</span>
    </div>
  `).join('');
}

function pickRandomQuote() {
  const q = quotes[Math.floor(Math.random() * quotes.length)];
  document.getElementById('quoteText').textContent = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
}

window.addEventListener('DOMContentLoaded', restoreAtlasState);
</script>
</body>
</html>
